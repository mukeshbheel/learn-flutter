name: learn_flutter
description: A new Flutter project.
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ">= 3.1.0 < 4.0.0"
dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^2.32.0
  cupertino_icons: ^1.0.2
  flutter_google_places_hoc081098: ^1.2.0
  google_sign_in: ^6.0.2
  #  firebase_auth: ^4.3.0
  flutter_facebook_auth: ^6.0.4
  #  cloud_firestore: ^4.8.0
  image_picker: ^1.0.4
  firebase_storage: ^11.2.2
  word_generator: ^0.4.3
  url_launcher: ^6.1.11
  flutter_html: ^3.0.0-beta.2
  get: ^4.6.5

  user_repository:
    path: packages/user_repository

  bloc: ^8.1.4
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  firebase_auth: ^4.3.0

#  number_trivia packages
  dartz: ^0.10.1  # for functional programming handling error cases

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Schyler
      fonts:
        - asset: assets/Fonts/JosefinSans-Bold.ttf
        - asset: assets/Fonts/JosefinSans-Light.ttf
        - asset: assets/Fonts/JosefinSans-Medium.ttf
        - asset: assets/Fonts/JosefinSans-Regular.ttf
        - asset: assets/Fonts/JosefinSans-Thin.ttf
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
